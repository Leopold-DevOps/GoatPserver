# Redis config for the local game server.
#
# Without this, redis-server starts with snapshotting disabled entirely
# ("save" empty, appendonly no), so every restart silently wiped all accounts
# and characters. Both persistence mechanisms are enabled below.

port 6379

# Data lives outside the git repo. Relative to the working directory, which
# start-servers.bat sets to this folder (betterSkillys/source/Redis).
dir ../../../redis-data

# Point-in-time snapshots: after 60s if at least 1 key changed, and so on.
dbfilename dump.rdb
save 60 1
save 300 10
save 900 1

# Append-only log, the durable one: replayed on startup, at most ~1s of loss.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Keep serving reads if a background save fails rather than rejecting writes.
stop-writes-on-bgsave-error no
